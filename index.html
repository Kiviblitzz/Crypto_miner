<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HASHWERK – Vom Kinderzimmer zum Rechenzentrum</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316181d'/><path d='M18 14v36M46 14v36M18 32h28' stroke='%23ffb000' stroke-width='8' stroke-linecap='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="c"></canvas>
  <div id="heat"></div>
  <div id="hud">
    <header id="top">
      <div class="brand">HASH<span>WERK</span></div>
      <div id="date" class="pill"></div>
      <div id="speed" class="pill"></div>
      <div class="stats">
        <div class="stat" id="st-cash"></div>
        <div class="stat" id="st-nw"></div>
        <div class="stat" id="st-profit"></div>
        <div class="stat" id="st-wallet"></div>
        <div class="stat" id="st-btc"></div>
        <div class="stat" id="st-hash"></div>
      </div>
    </header>
    <nav id="sites"></nav>
    <aside id="build" class="panel"></aside>
    <aside id="inspector" class="panel hidden"></aside>
    <section id="goals" class="panel"></section>
    <div id="dock"></div>
    <footer id="ticker"><div class="tk-label">NEWS</div><div id="tk-text"></div></footer>
    <div id="toasts"></div>
    <div id="hint" class="hidden"></div>
    <div id="crosshair"></div>
    <div id="prompt" class="hidden"></div>
    <div id="objmark" class="hidden"><span class="om-in"><kbd>E</kbd><span class="om-t"></span></span></div>
    <div id="clickhint" class="hidden">Klicken zum Spielen</div>
    <div id="keys"><span><kbd>B</kbd>Bauen</span><span><kbd>M</kbd>Markt</span><span><kbd>P</kbd>Handy</span><span><kbd>C</kbd>Firma</span><span><kbd>T</kbd>Technik</span><span><kbd>K</kbd>Karte</span><span><kbd>Esc</kbd>Menü</span></div>
    <div id="touchpad" class="hidden"><div id="stick"><div id="knob"></div></div><button id="t-use">E</button><button id="t-build">B</button><button id="t-menu">≡</button></div>
  </div>
  <div id="tut" class="hidden"></div>
  <div id="featcards"></div>
  <div id="pause" class="hidden"><div class="pause-card"><div class="pause-brand"><svg class="pause-coin" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="62" r="50" fill="#a86400"/><circle cx="60" cy="58" r="50" fill="#ffd25c"/><circle cx="60" cy="58" r="40" fill="#ffc23a"/><path d="M45 36v44M75 36v44M45 58h30" stroke="#8a4f00" stroke-width="11" stroke-linecap="round" transform="translate(0 2)"/><path d="M45 36v44M75 36v44M45 58h30" stroke="#fff6d8" stroke-width="11" stroke-linecap="round"/></svg><svg class="pause-logo" viewBox="0 0 330 70" role="img" aria-label="HASHWERK"><g font-family="Fredoka, Nunito, Arial Rounded MT Bold, sans-serif" font-weight="700" font-size="56" stroke-linejoin="round" paint-order="stroke"><text x="6" y="54" fill="#5c3410" stroke="#2a1606" stroke-width="6" transform="translate(0 3)">HASH<tspan fill="#7a4300">WERK</tspan></text><text x="6" y="54" fill="#fff6e6" stroke="#2a1606" stroke-width="4">HASH<tspan fill="#ffc23a">WERK</tspan></text></g></svg></div><button id="pause-resume" class="btn big primary"><span class="bi"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="bt">Weiterspielen</span></button><button id="pause-menu" class="btn big"><span class="bi"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 11l8-6.5 8 6.5v8.5a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" fill="currentColor"/></svg></span><span class="bt">Hauptmenü</span></button><div class="pause-set"><button id="ps-sound" class="ps-t">Ton an</button><label class="ps-s">Maus<input id="ps-sens" type="range" min="0.5" max="2" step="0.1" value="1"/></label></div><div class="pause-note">Dein Spielstand wird automatisch gespeichert.</div></div></div>
  <div id="fade"></div>
  <div id="modal" class="hidden"><div class="modal-card"><button class="modal-x" title="Schließen">✕</button><div class="modal-body"></div></div></div>
  <div id="splash">
    <div class="splash-inner">
      <div class="logo-wrap">
        <svg class="logo-coin" viewBox="0 -10 132 132" aria-hidden="true">
          <defs>
            <radialGradient id="lgCoin" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff2b8"/><stop offset=".45" stop-color="#ffc83d"/><stop offset="1" stop-color="#d68a00"/></radialGradient>
            <linearGradient id="lgRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#a86400"/></linearGradient>
          </defs>
          <ellipse cx="60" cy="108" rx="36" ry="7" fill="rgba(0,0,0,.35)"/>
          <g transform="translate(9 -7)"><g class="logo-pick"><path d="M101 20 L80 55" stroke="#2a1606" stroke-width="14" stroke-linecap="round"/><path d="M101 20 L80 55" stroke="#c4864a" stroke-width="8" stroke-linecap="round"/><path d="M80 12 Q102 6 116 30" stroke="#2a1606" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M80 12 Q102 6 116 30" stroke="#efe3cf" stroke-width="10" stroke-linecap="round" fill="none"/></g></g>
          <circle cx="60" cy="58" r="48" fill="url(#lgRim)"/>
          <circle cx="60" cy="56" r="42" fill="url(#lgCoin)"/>
          <circle cx="60" cy="56" r="34" fill="none" stroke="#c07a00" stroke-width="3" stroke-dasharray="4 5" opacity=".55"/>
          <path d="M47 36v40M73 36v40M47 56h26" stroke="#8a4f00" stroke-width="10" stroke-linecap="round"/>
          <path d="M47 34v40M73 34v40M47 54h26" stroke="#fff6d8" stroke-width="10" stroke-linecap="round"/>
          <path d="M30 34a34 34 0 0 1 18-14" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".8"/>

        </svg>
        <svg class="logo-svg" viewBox="0 0 470 236" role="img" aria-label="HASHWERK">
          <defs>
            <linearGradient id="lgCream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe9c7"/></linearGradient>
            <linearGradient id="lgAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffda79"/><stop offset="1" stop-color="#f3ae36"/></linearGradient>
          </defs>
          <g transform="rotate(-1.5 235 118)" font-family="Fredoka, Nunito, Arial Rounded MT Bold, sans-serif" font-weight="700" font-size="112" stroke-linejoin="round" paint-order="stroke">
            <text x="10" y="104" fill="#5c3410" stroke="#2a1606" stroke-width="4" transform="translate(0 3)">HASH</text>
            <text x="10" y="104" fill="url(#lgCream)" stroke="#2a1606" stroke-width="3">HASH</text>
            <text x="58" y="214" fill="#7a4300" stroke="#2a1606" stroke-width="4" transform="translate(0 3)">WERK</text>
            <text x="58" y="214" fill="url(#lgAmber)" stroke="#2a1606" stroke-width="3">WERK</text>
          </g>
        </svg>
      </div>
      <div class="splash-btns">
        <button id="btn-continue" class="btn big hidden"><span class="bi"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="bt">Weiterspielen</span></button>
        <button id="btn-new" class="btn big primary"><span class="bi"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3l2.4 5.6L20 11l-5.6 2.4L12 19l-2.4-5.6L4 11l5.6-2.4z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></span><span class="bt">Neues Spiel</span></button>
      </div>
      <div class="disclaimer">Alle Namen fiktiv · keine Anlageberatung</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
